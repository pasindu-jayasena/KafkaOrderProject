[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-order-project"
version = "1.0.0"
description = "Avro orders, running averages, retries and a Kafka dead-letter queue"
requires-python = ">=3.11"
dependencies = ["confluent-kafka==2.12.0", "fastavro==1.12.1"]

[project.scripts]
orders = "orders.cli:main"

[tool.setuptools.package-data]
orders = ["schemas/*.avsc"]

[tool.setuptools.packages.find]
include = ["orders*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running Kafka broker"]
